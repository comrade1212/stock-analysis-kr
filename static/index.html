<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 주식 수급분석</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .tab-btn { background:#e5e7eb; color:#374151; transition:all .2s; }
    .tab-btn.active { background:#1e40af; color:#fff; }
    .tab-btn:hover:not(.active) { background:#d1d5db; }
    table { border-collapse:collapse; width:100%; font-size:.82rem; }
    th { background:#1e3a5f; color:#fff; padding:8px 10px; text-align:right; white-space:nowrap; position:sticky; top:0; z-index:1; }
    th:first-child { text-align:left; }
    td { padding:5px 10px; border-bottom:1px solid #e5e7eb; text-align:right; white-space:nowrap; }
    td:first-child { text-align:left; }
    tr:hover { background:#eff6ff; }
    .pos { color:#dc2626; font-weight:600; }
    .neg { color:#2563eb; font-weight:600; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- 헤더 -->
<div class="bg-blue-800 text-white px-6 py-4 shadow-lg">
  <h1 class="text-2xl font-bold">📈 한국 주식 수급분석</h1>
  <p class="text-blue-200 text-sm mt-1">KOSPI / KOSDAQ — 상장일부터 현재까지 수급 데이터</p>
</div>

<!-- 검색 -->
<div class="max-w-2xl mx-auto px-4 mt-6">
  <div class="relative">
    <input id="searchInput" type="text" autocomplete="off"
      placeholder="종목코드 또는 종목명 (예: 005930, 삼성전자)"
      class="w-full p-4 text-lg border-2 border-blue-300 rounded-xl shadow focus:outline-none focus:border-blue-600" />
    <div id="searchDrop"
      class="absolute z-20 w-full bg-white border border-gray-200 rounded-xl shadow-xl hidden max-h-64 overflow-y-auto mt-1">
    </div>
  </div>
  <p id="cacheNote" class="text-xs text-gray-400 mt-2 text-center">종목 목록 로딩 중...</p>
</div>

<!-- 로딩 -->
<div id="loading" class="hidden text-center py-16">
  <div class="inline-block h-12 w-12 animate-spin rounded-full border-4 border-blue-600 border-t-transparent"></div>
  <p class="mt-3 text-gray-600">데이터 수집 중입니다. 처음 조회 시 1~2분 소요될 수 있습니다.</p>
</div>

<!-- 메인 컨텐츠 -->
<div id="main" class="hidden max-w-screen-xl mx-auto px-4 pb-12 mt-4">

  <!-- 종목 요약 -->
  <div class="bg-white rounded-xl shadow p-4 mb-4 flex flex-wrap gap-6 items-center">
    <div>
      <span id="sName" class="text-2xl font-bold"></span>
      <span id="sTicker" class="ml-2 text-gray-400 text-sm"></span>
      <span id="sMarket" class="ml-1 text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded"></span>
    </div>
    <div class="ml-auto flex flex-wrap gap-6">
      <div class="text-right">
        <div class="text-xs text-gray-400">현재가</div>
        <div id="sPrice" class="text-xl font-bold"></div>
      </div>
      <div class="text-right">
        <div class="text-xs text-gray-400">등락률</div>
        <div id="sChange" class="text-xl font-bold"></div>
      </div>
      <div class="text-right">
        <div class="text-xs text-gray-400">거래량</div>
        <div id="sVol" class="text-lg font-semibold"></div>
      </div>
      <div class="text-right">
        <div class="text-xs text-gray-400">조회 기간</div>
        <div id="sPeriod" class="text-sm font-medium"></div>
      </div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="flex gap-2 mb-4">
    <button class="tab-btn active px-5 py-2 rounded-lg font-medium" data-tab="chart" onclick="showTab('chart')">차트</button>
    <button class="tab-btn px-5 py-2 rounded-lg font-medium" data-tab="supply" onclick="showTab('supply')">수급분석표</button>
    <button class="tab-btn px-5 py-2 rounded-lg font-medium" data-tab="table" onclick="showTab('table')">일별 데이터</button>
  </div>

  <!-- 차트 탭 -->
  <div id="tab-chart">
    <div class="grid grid-cols-1 gap-4">
      <div class="bg-white rounded-xl shadow p-4">
        <h3 class="font-bold text-gray-700 mb-3">종가 / 거래량</h3>
        <canvas id="priceChart" height="100"></canvas>
      </div>
      <div id="invChartWrap" class="bg-white rounded-xl shadow p-4">
        <h3 class="font-bold text-gray-700 mb-3">투자자별 누적순매수 (단위: 억원)</h3>
        <canvas id="invChart" height="100"></canvas>
      </div>
    </div>
  </div>

  <!-- 수급분석표 탭 -->
  <div id="tab-supply" class="hidden space-y-4">
    <div class="bg-white rounded-xl shadow p-4">
      <h3 class="font-bold text-gray-700 mb-3">📊 최근 10영업일 수급 집계</h3>
      <div id="supply10" class="overflow-x-auto"></div>
    </div>
    <div class="bg-white rounded-xl shadow p-4">
      <h3 class="font-bold text-gray-700 mb-3">📋 최근 20일 누적수급 현황</h3>
      <div id="supplyRecent" class="overflow-x-auto"></div>
    </div>
  </div>

  <!-- 일별 데이터 탭 -->
  <div id="tab-table" class="hidden">
    <div class="bg-white rounded-xl shadow p-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-gray-700">일별 시세 및 수급</h3>
        <span id="totalRows" class="text-sm text-gray-400"></span>
      </div>
      <div id="dailyTable" class="overflow-x-auto"></div>
      <div id="pagination" class="flex justify-center gap-1 mt-4 flex-wrap"></div>
    </div>
  </div>

</div>

<script>
let stockData = null;
let priceChart = null;
let invChart = null;
let currentPage = 1;
const PAGE = 50;

// 캐시 상태 폴링
async function pollCache() {
  try {
    const r = await fetch('/api/cache-status');
    const d = await r.json();
    const el = document.getElementById('cacheNote');
    if (d.ready) {
      el.textContent = `종목 ${d.count.toLocaleString()}개 로드 완료`;
    } else {
      el.textContent = `종목 목록 로딩 중... (${d.count}개)`;
      setTimeout(pollCache, 3000);
    }
  } catch (e) {
    setTimeout(pollCache, 5000);
  }
}
pollCache();

// 검색
const inp = document.getElementById('searchInput');
const drop = document.getElementById('searchDrop');
let timer;
inp.addEventListener('input', () => {
  clearTimeout(timer);
  const q = inp.value.trim();
  if (!q) { drop.classList.add('hidden'); return; }
  timer = setTimeout(() => doSearch(q), 300);
});
document.addEventListener('click', e => { if (!inp.contains(e.target)) drop.classList.add('hidden'); });

async function doSearch(q) {
  const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  const list = await r.json();
  if (!list.length) {
    drop.innerHTML = '<div class="p-3 text-gray-400 text-sm">검색 결과가 없습니다.</div>';
  } else {
    drop.innerHTML = list.map(x =>
      `<div class="p-3 hover:bg-blue-50 cursor-pointer border-b flex justify-between items-center"
           onclick="loadStock('${x.ticker}','${x.name}','${x.market}')">
         <span class="font-medium">${x.name}</span>
         <span class="text-gray-400 text-xs">${x.ticker} · ${x.market}</span>
       </div>`
    ).join('');
  }
  drop.classList.remove('hidden');
}

async function loadStock(ticker, name, market) {
  drop.classList.add('hidden');
  inp.value = `${name} (${ticker})`;
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('main').classList.add('hidden');

  try {
    const r = await fetch(`/api/stock/${ticker}`);
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail || '오류'); }
    stockData = await r.json();
    renderAll(market);
  } catch (e) {
    alert('오류: ' + e.message);
  } finally {
    document.getElementById('loading').classList.add('hidden');
  }
}

function renderAll(market) {
  const data = stockData.data;
  if (!data.length) return;

  const latest = data[data.length - 1];
  const prev = data.length > 1 ? data[data.length - 2] : latest;

  document.getElementById('sName').textContent = stockData.name;
  document.getElementById('sTicker').textContent = stockData.ticker;
  document.getElementById('sMarket').textContent = market || '';
  document.getElementById('sPrice').textContent = latest['종가']?.toLocaleString() + '원';

  const chg = latest['등락률'] ?? 0;
  const chgEl = document.getElementById('sChange');
  chgEl.textContent = (chg > 0 ? '+' : '') + chg + '%';
  chgEl.className = 'text-xl font-bold ' + (chg > 0 ? 'pos' : chg < 0 ? 'neg' : '');

  document.getElementById('sVol').textContent = latest['거래량']?.toLocaleString() + '주';
  document.getElementById('sPeriod').textContent = data[0].date + ' ~ ' + latest.date;

  document.getElementById('main').classList.remove('hidden');
  renderPriceChart();
  renderInvChart();
  renderSupply();
  renderDailyTable(1);
}

function renderPriceChart() {
  const d = stockData.data;
  if (priceChart) priceChart.destroy();
  priceChart = new Chart(document.getElementById('priceChart').getContext('2d'), {
    data: {
      labels: d.map(r => r.date),
      datasets: [
        { type: 'line', label: '종가', data: d.map(r => r['종가']), borderColor: '#1d4ed8', borderWidth: 1.5, pointRadius: 0, yAxisID: 'y', tension: 0.1 },
        { type: 'bar', label: '거래량', data: d.map(r => r['거래량']), backgroundColor: 'rgba(156,163,175,0.45)', yAxisID: 'y1' }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { ticks: { maxTicksLimit: 14, font: { size: 10 } }, grid: { display: false } },
        y: { position: 'right', ticks: { callback: v => v.toLocaleString() } },
        y1: { position: 'left', grid: { drawOnChartArea: false }, ticks: { callback: v => v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v.toLocaleString() } }
      },
      plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } }
    }
  });
}

function renderInvChart() {
  const cols = stockData.inv_cols;
  if (!cols || !cols.length) { document.getElementById('invChartWrap').classList.add('hidden'); return; }

  const d = stockData.data;
  const COLORS = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#8b5cf6','#06b6d4','#f97316','#ec4899','#14b8a6','#84cc16','#a855f7'];

  if (invChart) invChart.destroy();
  invChart = new Chart(document.getElementById('invChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: d.map(r => r.date),
      datasets: cols.map((col, i) => ({
        label: col,
        data: d.map(r => +(r[`누적_${col}`] / 1e8).toFixed(2)),
        borderColor: COLORS[i % COLORS.length],
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.1
      }))
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { ticks: { maxTicksLimit: 14, font: { size: 10 } }, grid: { display: false } },
        y: { ticks: { callback: v => v + '억' } }
      },
      plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } }
    }
  });
}

function renderSupply() {
  const cols = stockData.inv_cols;
  const data = stockData.data;
  if (!cols || !cols.length || !data.length) return;

  const last10 = data.slice(-10);
  const latest = data[data.length - 1];

  // 10일 집계표
  let html = `<table><thead><tr>
    <th>투자자</th><th>10일 순매수합계</th><th>매수우세(일)</th><th>매도우세(일)</th><th>누적순매수(전체)</th>
  </tr></thead><tbody>`;

  cols.forEach(col => {
    const vals = last10.map(d => d[col] || 0);
    const total = vals.reduce((a, b) => a + b, 0);
    const cum = latest[`누적_${col}`] || 0;
    const buyDays = vals.filter(v => v > 0).length;
    const sellDays = vals.filter(v => v < 0).length;
    html += `<tr>
      <td><strong>${col}</strong></td>
      <td class="${total > 0 ? 'pos' : total < 0 ? 'neg' : ''}">${fmt(total)}</td>
      <td>${buyDays}일</td>
      <td>${sellDays}일</td>
      <td class="${cum > 0 ? 'pos' : cum < 0 ? 'neg' : ''}">${fmt(cum)}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('supply10').innerHTML = html;

  // 최근 20일 누적 테이블
  const last20 = data.slice(-20).reverse();
  let h2 = '<table><thead><tr><th>날짜</th><th>종가</th>';
  cols.forEach(col => h2 += `<th>${col}<br><span style="font-weight:400;font-size:10px">누적</span></th>`);
  h2 += '</tr></thead><tbody>';
  last20.forEach(d => {
    h2 += `<tr><td>${d.date}</td><td>${d['종가']?.toLocaleString()}</td>`;
    cols.forEach(col => {
      const v = d[`누적_${col}`] || 0;
      h2 += `<td class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${fmt(v)}</td>`;
    });
    h2 += '</tr>';
  });
  h2 += '</tbody></table>';
  document.getElementById('supplyRecent').innerHTML = h2;
}

function renderDailyTable(page) {
  const cols = stockData.inv_cols || [];
  const data = [...stockData.data].reverse();
  currentPage = page;

  const total = data.length;
  const pageData = data.slice((page - 1) * PAGE, page * PAGE);
  document.getElementById('totalRows').textContent = `총 ${total.toLocaleString()}거래일`;

  let html = '<table><thead><tr><th>날짜</th><th>종가</th><th>등락률</th><th>거래량</th>';
  cols.forEach(col => html += `<th>${col}</th>`);
  html += '</tr></thead><tbody>';

  pageData.forEach(d => {
    const chg = d['등락률'] ?? 0;
    html += `<tr>
      <td>${d.date}</td>
      <td>${d['종가']?.toLocaleString()}</td>
      <td class="${chg > 0 ? 'pos' : chg < 0 ? 'neg' : ''}">${chg > 0 ? '+' : ''}${chg}%</td>
      <td>${d['거래량']?.toLocaleString()}</td>`;
    cols.forEach(col => {
      const v = d[col] || 0;
      html += `<td class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${fmt(v)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('dailyTable').innerHTML = html;

  // 페이지네이션
  const totalPages = Math.ceil(total / PAGE);
  let pg = '';
  if (page > 1) pg += `<button onclick="renderDailyTable(${page - 1})" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">‹</button>`;
  for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
    pg += `<button onclick="renderDailyTable(${i})" class="px-3 py-1 rounded ${i === page ? 'bg-blue-700 text-white' : 'bg-gray-200 hover:bg-gray-300'}">${i}</button>`;
  }
  if (page < totalPages) pg += `<button onclick="renderDailyTable(${page + 1})" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">›</button>`;
  document.getElementById('pagination').innerHTML = pg;
}

function showTab(name) {
  ['chart', 'supply', 'table'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== name);
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === name);
  });
}

function fmt(v) {
  if (v === 0 || v === null || v === undefined) return '0';
  const abs = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (abs >= 1e12) return sign + (abs / 1e12).toFixed(1) + '조';
  if (abs >= 1e8) return sign + (abs / 1e8).toFixed(1) + '억';
  if (abs >= 1e4) return sign + (abs / 1e4).toFixed(0) + '만';
  return v.toLocaleString();
}
</script>
</body>
</html>
